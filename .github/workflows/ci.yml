name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test hooks/*.test.mjs page/*.test.mjs scripts/*.test.mjs

  directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global @anthropic-ai/claude-code@2.1.316
      - run: claude plugin validate . --strict --profile directory

  page:
    # Runs page/page.js in the runner's Chrome. A Mac, as the record was captured on one: on a Linux runner, the probe's
    # tap arrives as touch events with no click after them.
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node observations/browsers/closed-row.probe.mjs --check

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/version-check.mjs "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
